[project]
name = "deepagents-poc"
version = "0.1.0"
description = "Deep Agents POC - Tax QA Agent"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.6.3",
    "langchain-ollama>=1.0",
    "python-docx>=1.1.2",
    "pydantic>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "langfuse>=3.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "langgraph-checkpoint-postgres>=3.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
